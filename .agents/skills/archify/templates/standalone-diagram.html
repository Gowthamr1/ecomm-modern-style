<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Architecture Diagram</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --primary: #3b82f6;
      --accent: #10b981;
    }
    body.light {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --accent: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .title { font-weight: 600; font-size: 15px; }
    .controls { display: flex; gap: 8px; }
    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    button:hover { background: var(--border); }
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
      position: relative;
    }
    #canvas-container:active { cursor: grabbing; }
    svg {
      width: 100%;
      height: 100%;
      user-select: none;
    }
    .node rect {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1.5;
      rx: 8;
      transition: stroke 0.2s, filter 0.2s;
    }
    .node:hover rect {
      stroke: var(--primary);
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
    }
    .node text.title {
      font-size: 13px;
      font-weight: 600;
      fill: var(--text);
    }
    .node text.subtitle {
      font-size: 11px;
      fill: var(--text-muted);
    }
    .edge path {
      fill: none;
      stroke: var(--border);
      stroke-width: 1.5;
      transition: stroke 0.2s;
    }
    .edge.active path {
      stroke: var(--primary);
      stroke-width: 2.5;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="title" id="diagram-title">Architecture Overview</div>
    <div class="controls">
      <button onclick="zoom(0.1)">Zoom In (+)</button>
      <button onclick="zoom(-0.1)">Zoom Out (-)</button>
      <button onclick="resetZoom()">Reset</button>
      <button onclick="toggleTheme()">Theme</button>
    </div>
  </div>
  <div id="canvas-container">
    <svg id="diagram-svg">
      <g id="viewport">
        <!-- Nodes & Edges dynamically rendered here -->
      </g>
    </svg>
  </div>
  <script>
    let scale = 1, panX = 0, panY = 0, isPanning = false, startX = 0, startY = 0;
    const viewport = document.getElementById("viewport");
    const container = document.getElementById("canvas-container");

    function updateTransform() {
      viewport.setAttribute("transform", `translate(${panX}, ${panY}) scale(${scale})`);
    }

    container.addEventListener("mousedown", (e) => {
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => isPanning = false);
    container.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(0.3, scale * zoomFactor), 3);
      updateTransform();
    });

    function zoom(delta) { scale = Math.min(Math.max(0.3, scale + delta), 3); updateTransform(); }
    function resetZoom() { scale = 1; panX = 0; panY = 0; updateTransform(); }
    function toggleTheme() { document.body.classList.toggle("light"); }
  </script>
</body>
</html>
